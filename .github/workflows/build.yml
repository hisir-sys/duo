name: DuoAI CI and Windows installer

on:
  push:
    branches: [main, feat/duoai-reliability-release]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Tests (Python 3.11)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-lock.txt
      - run: python -m compileall -q .
      - run: pytest -q

  windows-installer:
    name: Build Windows setup EXE
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-lock.txt
      - name: Build application bundle
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name DuoAI --collect-all PySide6 --collect-all shiboken6 --collect-all anthropic --collect-all openai --hidden-import keyring.backends.Windows --hidden-import sounddevice --hidden-import numpy --hidden-import pypdf --hidden-import docx main.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Create setup executable
        shell: pwsh
        run: |
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $compiler = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { $compiler = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler ISCC.exe was not found" }
          & $compiler installer.iss
      - name: Clean install and launch smoke test
        shell: pwsh
        run: |
          if (!(Test-Path "dist/DuoAI/DuoAI.exe")) { throw "DuoAI.exe missing from bundle" }
          $installer = Get-ChildItem "dist-installer/*.exe" | Select-Object -First 1
          if (!$installer) { throw "Setup executable was not created" }
          $installDir = Join-Path $env:RUNNER_TEMP "DuoAI-CleanInstall"
          & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "Silent installer failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "$installDir/DuoAI.exe")) { throw "Installed app executable is missing" }
          $env:QT_QPA_PLATFORM = "offscreen"
          & "$installDir/DuoAI.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "Installed application smoke test failed with exit code $LASTEXITCODE" }
          & "$installDir/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Uninstaller smoke test failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: DuoAI-Windows-Installer
          path: dist-installer/*.exe
          if-no-files-found: error
      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.exe
